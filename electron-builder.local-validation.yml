appId: com.notiventa.agent.localvalidation
productName: NotiVenta Agent Local Validation
executableName: NotiVentaAgentLocalValidation

directories:
  output: dist/local-validation

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/@napi-rs/keyring*/**/*.node

win:
  target:
    - target: nsis
      arch:
        - arm64
  artifactName: NotiVenta-Local-Validation-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NotiVenta Agent Local Validation
  uninstallDisplayName: NotiVenta Agent Local Validation

publish: null
