appId: com.notiventa.agent.staging
productName: NotiVenta Agent Staging
executableName: NotiVentaAgentStaging

directories:
  output: dist/staging

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/diagnostic-label.html
    to: diagnostic/diagnostic-label.html

asar: true
asarUnpack:
  - node_modules/@napi-rs/keyring*/**/*.node

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: NotiVenta-Staging-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NotiVenta Agent Staging
  uninstallDisplayName: NotiVenta Agent Staging

publish: null
